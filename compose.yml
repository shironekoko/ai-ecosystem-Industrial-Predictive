services:
  # -------------------------
  # ส่วนของ Redis
  # -------------------------
  redis:
    image: redis:8.8.0-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./logs:/logs
    command: sh -c "redis-server --appendonly yes 2>&1 | tee /logs/redis.log"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # ส่วนของ PostgreSQL
  # -------------------------
  db:
    image: postgres:15.4-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./logs:/logs
    command: postgres -c logging_collector=on -c log_directory=/logs -c log_filename=postgres.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # ส่วนของ MinIO (Object Storage)
  # -------------------------
  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - ./logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# -------------------------
# ส่วนของ Backend API (FastAPI)
# -------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/mydatabase
      - MINIO_ENDPOINT=minio:9000
      # ── Tool life (RUL) streaming: แบบจำลองดึงจาก MinIO bucket models/tool-rul/, ข้อมูลจาก ./dataset (LUH) ──
      - TOOL_LIFE_AUTOSTART=true          # เริ่มสตรีมดอกที่สงวนไว้ (T3/T6/T9) ตามเวลาจริงเมื่อ backend เริ่ม
      - TOOL_LIFE_HOLD_ON_REPLACE=true    # interlock: หยุดป้อนเมื่อระบบสั่ง REPLACE_NOW รอผู้ควบคุมยืนยัน
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:                          # GET /api/v1/health — frontend รอจน backend พร้อม
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./logs:/logs
      - ./dataset:/dataset:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # ส่วนของ Trainer Worker (ARQ + GPU)
  # -------------------------
  trainer-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.trainer
    container_name: trainer-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./logs:/logs
      - ./dataset:/dataset:ro
    # ── GPU ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # TensorBoard — กราฟการฝึก: retrain ใน trainer-worker (logs/tensorboard) + การทดลองเลือกแบบจำลอง (nontime_docs)
  # -------------------------
  tensorboard:
    image: python:3.12-slim
    container_name: tensorboard
    restart: unless-stopped
    command: >
      sh -c "pip install -q --no-cache-dir 'tensorboard>=2.17' 'setuptools<81' &&
             mkdir -p /logs/tensorboard/tool-vision &&
             tensorboard --logdir_spec retrain:/logs/tensorboard/tool-vision,experiments:/experiments --bind_all --port 6006"
    ports:
      - "6006:6006"
    volumes:
      - ./logs:/logs
      - ./nontime_docs/tool_vb_vision/runs:/experiments:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # ส่วนของ Frontend UI (React + Vite)
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_USE_POLLING=true            # hot reload ทำงานบน bind mount ของ Windows
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

# -------------------------
# ส่วนประกาศสร้าง Volumes
# -------------------------
volumes:
  redis-data:
  postgresql-data:
  minio-data: